name: Linux x64 release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config curl git python3 \
            autoconf automake libtool bison flex squashfs-tools desktop-file-utils libncurses-dev libssl-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup override set 1.99.0
      - name: Build simulator
        run: make emulator-setup
      - name: Check and test
        run: make check test emulator-conformance
      - name: Build release bundle
        run: make release-package
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rallye-linux-x86_64
          path: target/dist/*
          if-no-files-found: error
      - name: Attach assets to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" target/dist/* --clobber
